<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPrep Admin - Upload Panel</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar">
            <div class="sidebar-logo">
                <img src="V Prep (1).png" alt="VPrep Logo">
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-section="login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
                <a href="#" class="nav-item" data-section="upload" style="display: none;">
                    <i class="fas fa-cloud-upload-alt"></i> Upload Files
                </a>
                <a href="#" class="nav-item" data-section="manage" style="display: none;">
                    <i class="fas fa-list"></i> Manage Files
                </a>
                <a href="#" class="nav-item" id="logoutBtn" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </nav>
        </aside>


        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <h1 id="pageTitle">Admin Login</h1>
                <div class="header-actions">
                    <span id="adminName" style="display: none;">Welcome, <strong id="adminUsername"></strong></span>
                    <button id="headerLogout" class="btn-logout" style="display: none;">Logout</button>
                </div>
            </header>


            <!-- Content Sections -->
            <div class="admin-content">


                <!-- LOGIN SECTION -->
                <section id="loginSection" class="content-section active">
                    <div class="login-container">
                        <div class="login-card">
                            <h2>Admin Login</h2>
                            <form id="loginForm">
                                <div class="form-group">
                                    <label for="username">Username</label>
                                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                                </div>
                                <div class="form-group">
                                    <label for="password">Password</label>
                                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                                </div>
                                <button type="submit" class="btn-primary" style="width: 100%;">
                                    <i class="fas fa-sign-in-alt"></i> Login
                                </button>
                            </form>
                        </div>
                    </div>
                </section>


                <!-- UPLOAD SECTION -->
                <section id="uploadSection" class="content-section">
                    <div class="upload-wrapper">
                        <h2><i class="fas fa-cloud-upload-alt"></i> Upload Study Materials</h2>
                        
                        <form id="uploadForm" class="upload-form">
                            <!-- Subject Select -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="subject">Subject <span class="required">*</span></label>
                                    <select id="subject" name="subject" required>
                                        <option value="">Loading subjects...</option>
                                    </select>
                                </div>


                                <!-- File Type Select -->
                                <div class="form-group">
                                    <label for="fileType">File Type <span class="required">*</span></label>
                                    <select id="fileType" name="fileType" required>
                                        <option value="">Select type...</option>
                                        <option value="notes">Study Notes</option>
                                        <option value="assignment">Assignment</option>
                                        <option value="pyq">Past Year Questions</option>
                                    </select>
                                </div>
                            </div>


                            <!-- File Upload Drag & Drop -->
                            <div class="form-group">
                                <label>Upload File <span class="required">*</span></label>
                                <div id="dropZone" class="drop-zone">
                                    <i class="fas fa-file-pdf"></i>
                                    <p class="drop-text">Drag and drop your PDF here<br><small>or click to browse</small></p>
                                    <input type="file" id="fileInput" name="file" accept=".pdf" hidden required>
                                </div>
                                <p id="fileName" class="file-name-display"></p>
                            </div>


                            <!-- Submit Button -->
                            <button type="submit" class="btn-primary btn-large">
                                <i class="fas fa-upload"></i> Upload File
                            </button>
                        </form>


                        <!-- Upload Status -->
                        <div id="uploadStatus" class="upload-status" style="display: none;">
                            <div id="statusContent"></div>
                        </div>
                    </div>
                </section>


                <!-- MANAGE FILES SECTION -->
                <section id="manageSection" class="content-section">
                    <div class="manage-wrapper">
                        <h2><i class="fas fa-list"></i> Manage Files</h2>


                        <!-- Filter Options -->
                        <div class="filter-section">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="filterSubject">Filter by Subject:</label>
                                    <select id="filterSubject">
                                        <option value="">All Subjects</option>
                                    </select>
                                </div>
                                <button onclick="loadUploadedFiles()" class="btn-secondary">
                                    <i class="fas fa-sync"></i> Refresh
                                </button>
                            </div>
                        </div>


                        <!-- Files Table -->
                        <div class="files-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>File Name</th>
                                        <th>Subject</th>
                                        <th>Type</th>
                                        <th>Size</th>
                                        <th>Uploaded</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="filesTableBody">
                                    <tr>
                                        <td colspan="6" style="text-align: center; padding: 40px;">
                                            <i class="fas fa-inbox" style="font-size: 2rem; color: #ccc;"></i>
                                            <p>No files uploaded yet</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>


            </div>
        </main>
    </div>
    <script src="admin.js"></script>
</body>
</html>
