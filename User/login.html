<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VPrep Login</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="login.css">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      connect-src 'self' https://vprep.up.railway.app;
      style-src 'self' 'unsafe-inline' https://accounts.google.com;
      script-src 'self' https://accounts.google.com https://cdn.jsdelivr.net;
      frame-src https://accounts.google.com;
      font-src 'self';
    "
  >
  </head>
<body>
  <div class="login-wrapper">
    <div class="login-card">

      <!-- LEFT: FORM -->
      <div class="login-left">
        <h2>Log In</h2>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <form id="loginForm">
          <label>Email</label>
          <input id="email" type="email" placeholder="Enter your email" required>

          <label>Password</label>
          <input id="password" type="password" placeholder="Enter your password" required>

          <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

          <!-- loading / butter motion button -->
          <button type="submit" id="loginBtn" class="primary-btn">
            <span class="btn-text">Log In</span>
            <span class="btn-loader"></span>
          </button>

          <div id="google-signin"></div>

          <p class="bottom-text">
            Don’t have an account?
            <a href="signup.html" class="signup-link">Sign up</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="login.js"></script>
</body>
</html>
