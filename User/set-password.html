<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set your VPrep password</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="set-password.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h2>Set your password</h2>
      <p>You signed up with Google. Create a password to also log in using email and password.</p>

      <form id="set-password-form">
        <input
          type="password"
          id="new-password"
          placeholder="New password"
          required
        >
        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm password"
          required
        >

        <button type="submit" id="savePasswordBtn" class="primary-btn">
          <span class="btn-text">Save password</span>
          <span class="btn-loader"></span>
        </button>
      </form>
    </div>
  </div>
  <script src="set-password.js"></script>
</body>
</html>
