<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password – VPrep</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-left">
        <h2>Forgot Password</h2>
        <p class="subtitle">Enter your email and we will send you a reset link.</p>

        <form id="forgot-form">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" type="email" placeholder="Enter your email" />

          <button type="submit" class="primary-btn">Send reset link</button>

          <p class="bottom-text">
            Remembered your password?
            <a href="login.html" class="signup-link">Back to log in</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="forgot-password.js"></script>
</body>
</html>
